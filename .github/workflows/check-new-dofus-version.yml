name: Check new Dofus version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check_json.outputs.changed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/process-items.mjs

      - name: Check if JSON changed
        id: check_json
        run: |
          git diff --quiet public/data/items.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Get version
        id: get_version
        if: steps.check_json.outputs.changed == 'true'
        run: |
          echo "version=$(jq -r '.version' public/data/items.json)" >> $GITHUB_OUTPUT

      - name: Download images
        if: steps.check_json.outputs.changed == 'true'
        run: node scripts/download-images.mjs

      - name: Commit if changes
        if: steps.check_json.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data/items.json public/images/
          git commit -m "chore: New version : (v${{ steps.get_version.outputs.version }})"
          git tag "v${{ steps.get_version.outputs.version }}"
          git push
          git push --tags

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
